name: ci
on: [push, pull_request]

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - run: pytest -q tests/test_repo_rules.py

  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check kairos/ tests/ loadtest/
      - run: uv run mypy --strict kairos/

  tests-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -v --cov=kairos --cov-report=term-missing --cov-report=xml:coverage.xml tests/
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run bandit -r kairos/ -c .bandit.yml
      - run: uv run pip-audit
      - name: Generate CycloneDX SBOM via Syft
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: cyclonedx-sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: cyclonedx-sbom.json

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm run typecheck
      - run: cd web && npm run test

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start container
        run: docker compose up -d --build
      - name: Wait for /v1/ready probe
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/v1/ready || true)
            if [ "$STATUS" = "200" ]; then
              echo "Kairos service is ready (status 200)!"
              exit 0
            fi
            echo "Waiting for /v1/ready (status=$STATUS)... attempt $i"
            sleep 2
          done
          echo "Timeout waiting for /v1/ready"
          docker compose logs kairos
          exit 1
      - name: Verify health and readiness endpoints
        run: |
          curl -f http://localhost:8000/v1/health
          curl -f http://localhost:8000/v1/ready
      - name: Verify Pune workshop query in container (top 3 must contain Doc_12 §2)
        run: |
          OUTPUT=$(docker compose exec -T kairos kairos query "What is the capacity of workshop venues in Pune?")
          echo "$OUTPUT"
          echo "$OUTPUT" | head -n 12 | grep -E "Doc_12.*2" || {
            echo "Doc_12 §2 not found in top 3 results!"
            exit 1
          }
      - name: Teardown
        if: always()
        run: docker compose down

  mvp-replay-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start container
        run: docker compose up -d --build
      - name: Wait for /v1/ready
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/v1/ready || true)
            if [ "$STATUS" = "200" ]; then echo "ready"; exit 0; fi
            sleep 2
          done
          docker compose logs kairos; exit 1
      - name: Replay three demo scenarios headlessly
        run: docker compose exec -T kairos kairos replay demo --out /tmp/replay_out
      - name: Assert controller decisions present in replay output
        run: |
          OUTPUT=$(docker compose exec -T kairos cat /tmp/replay_out/replay_summary.json)
          echo "$OUTPUT"
          echo "$OUTPUT" | python3 -c "
          import json, sys
          records = json.load(sys.stdin)
          assert len(records) >= 5, f'Expected >=5 turns, got {len(records)}'
          for r in records:
              assert 'decisions' in r, f'Missing decisions in {r[\"turn_id\"]}'
          print('decisions check: PASS')
          "
      - name: Assert >= 1 leg on compound turn (S1)
        run: |
          OUTPUT=$(docker compose exec -T kairos cat /tmp/replay_out/replay_summary.json)
          echo "$OUTPUT" | python3 -c "
          import json, sys
          records = json.load(sys.stdin)
          compound = [r for r in records if r['type'] == 'compound']
          assert compound, 'No compound turn found'
          assert len(compound[0]['legs']) >= 1, f'No legs on compound turn: {compound[0]}'
          print('leg count check: PASS')
          "
      - name: Assert version bump on late_constraint turn (S2-T2)
        run: |
          OUTPUT=$(docker compose exec -T kairos cat /tmp/replay_out/replay_summary.json)
          echo "$OUTPUT" | python3 -c "
          import json, sys
          records = json.load(sys.stdin)
          lc = [r for r in records if r['type'] == 'late_constraint']
          assert lc, 'No late_constraint turn found'
          assert lc[0]['version'] >= 2, f'Expected version >=2, got {lc[0][\"version\"]}'
          print('version bump check: PASS')
          "
      - name: Assert zero retrievals on presentation_only turn (S3-T2)
        run: |
          OUTPUT=$(docker compose exec -T kairos cat /tmp/replay_out/replay_summary.json)
          echo "$OUTPUT" | python3 -c "
          import json, sys
          records = json.load(sys.stdin)
          po = [r for r in records if r['type'] == 'presentation_only']
          assert po, 'No presentation_only turn found'
          assert po[0]['first_retrieval_t'] is None, f'Expected no retrieval, got {po[0][\"first_retrieval_t\"]}'
          print('zero-retrieval suppression check: PASS')
          "
      - name: Run eval suite in container
        run: docker compose exec -T kairos make eval
      - name: Verify gates.json exists
        run: |
          docker compose exec -T kairos test -f runs/eval/gates.json && echo "gates.json exists: PASS"
      - name: Run automated load-test benchmark
        run: docker compose exec -T kairos python -m loadtest.run_bench
      - name: Copy eval and loadtest artifacts from container
        run: |
          docker compose cp kairos:/app/runs/eval ./eval-artifacts
          docker compose cp kairos:/app/runs/loadtest ./loadtest-artifacts
      - name: Upload Eval Report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: ./eval-artifacts/
      - name: Upload Loadtest Results artifact
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: ./loadtest-artifacts/
      - name: Teardown
        if: always()
        run: docker compose down

  ci-gate:
    needs: [repo-rules, lint-and-type, tests-and-coverage, security-scans, frontend-checks, docker-smoke, mvp-replay-eval]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All parallel CI checks and gates passed successfully!"
